spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
aws.s3.bucket=${AWS_S3_BUCKET}
aws.eventBridge.bus=default

# A fusionner dans src/main/resources/application.properties existant.
#
# DB_URL, DB_USERNAME, DB_PASSWORD sont des variables d'environnement custom
# declarees cote Poja (dashboard > environnement preprod/prod), pointant vers
# l'instance Neon (voir README-implementation.md).

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Necessaire pour accepter l'upload multipart (POST /images).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect